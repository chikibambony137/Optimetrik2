name: Test Workflow

on:
    push:
        branches:
            - master
    pull_request:
        branches: [ master ]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
          - uses: actions/checkout@v6

          - name: show vars
            run: |
                echo "Commit SHA: ${{ github.sha }}"
                echo "Branch: ${{ github.ref_name }}"
                echo "Repository: ${{ github.repository }}"
                echo "Run ID: ${{ github.run_id }}"
        
          - name: build-backend
            run: |
                cd backend/
                docker build -t back:${{ github.sha }} .
                docker images | grep back
          
          - name: Build frontend image
            run: |
                cd frontend
                docker build -t front:${{ github.sha }} .
                docker images | grep front
